server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zwt?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

mybatis:
  type-aliases-package: com.example.demo.model
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.example.demo.handler
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.demo.mapper: debug
    com.example.demo.service.UserService: info

# 文件上传目录配置
# 注意：路径使用绝对路径，确保文件存储在指定位置
file:
  # 资料库文件上传目录 - 用于存储资料库相关文件（文档、资料等）
  # 路径：最终版\uploads
  material-upload-dir: d:/计算机设计大赛web/最终版/最终版/uploads
  
  # 学习区视频文件上传目录 - 用于存储学习区视频资料
  # 路径：最终版\源码 (2)\源码\uploads
  video-upload-dir: d:/计算机设计大赛web/最终版/最终版/源码 (2)/源码/uploads
  
  # 通用上传目录（向后兼容）
  upload-dir: d:/计算机设计大赛web/最终版/最终版/uploads
