<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>资料库 - 知识协作平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../main.css?v=20261028"/>
    <link rel="stylesheet" href="library.css?v=20261028"/>
    <script src="../theme.js?v=20261028"></script>
    <style>
        .required {
            color: #dc3545;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-control:focus {
            outline: none;
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        .modal-body {
            max-height: 60vh;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #e9ecef;
        }
        .upload-area {
            border: 2px dashed #e2e8f0;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #4a6cf7;
            background-color: #f8fafc;
        }
        .btn-link {
            background: none;
            border: none;
            color: #007bff;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            font-size: 14px;
        }
        .btn-link:hover {
            color: #0056b3;
        }
        #file-info {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>
<!-- 导航栏 -->
<header>
  <div class="container">
    <div class="navbar">
      <div class="logo">
        <i class="fas fa-brain"></i>
        <span>知识协作平台</span>
      </div>

      <nav class="nav-links">
        <a href="../main.html" class="nav-link active" aria-current="page">
          <i class="fas fa-home"></i> 返回主页
        </a>

        <!-- 协作中心下拉 -->
        <div class="nav-dropdown">
          <button class="nav-dropdown-btn">
            协作中心 <i class="fas fa-chevron-down"></i>
          </button>
          <div class="nav-dropdown-content">
            <a href="../task-center/task-center.html" class="nav-link">任务中心</a>
            <a href="../schedule-center/schedule-center.html" class="nav-link">日程中心</a>
            <a href="../team-management/team-management.html" class="nav-link">成员中心</a>
          </div>
        </div>

        <!-- 知识库下拉 -->
        <div class="nav-dropdown">
          <button class="nav-dropdown-btn">
            知识库 <i class="fas fa-chevron-down"></i>
          </button>
          <div class="nav-dropdown-content">
            <a href="../library/library.html" class="nav-link">资料库</a>
            <a href="../learning-area/learning-area.html" class="nav-link">学习区</a>
          </div>
        </div>

        <a href="../personal-center/personal-center.html" class="nav-link">个人中心</a>
      </nav>

      <!-- 右侧功能：搜索、主题、通知、用户信息 -->
      <div class="header-actions">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="搜索内容、文档或成员..." id="global-search" aria-label="全局搜索">
        </div>

        <div class="theme-toggle">
          <input type="checkbox" id="theme-switch" hidden aria-label="切换主题">
          <label for="theme-switch" class="toggle-label">
            <i class="fas fa-sun"></i>
            <i class="fas fa-moon"></i>
            <span class="toggle-ball"></span>
          </label>
        </div>

        <div class="notifications" id="notifications-btn" aria-label="通知">
          <i class="fas fa-bell"></i>
          <span class="notification-badge">3</span>
        </div>

        <!-- 用户信息部分 -->
        <div class="user-info" id="user-info-btn">
          <div class="user-avatar"><i class="fas fa-user"></i></div>
          <div class="user-details">
            <div class="user-name" id="header-user-name">加载中...</div>
            <div class="user-rank" id="header-user-rank">加载中...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<div id="library" class="module-content active">
    <!-- 页面头部 -->
    <div class="module-header">
        <h2 class="module-title">
            <i class="fas fa-book-open"></i> 知识资料库
        </h2>
        <p class="module-subtitle">汇集组织智慧，助力知识传承</p>
    </div>

    <!-- 搜索与工具栏 -->
    <div class="library-toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="搜索文档、视频或规范..." id="library-search" />
        </div>

        <div class="library-controls">
            <select id="library-filter" class="form-control">
                <option value="all">全部类型</option>
                <option value="pdf">PDF</option>
                <option value="doc">Word</option>
                <option value="xls">Excel</option>
                <option value="ppt">PPT</option>
                <option value="video">视频</option>
                <option value="image">图片</option>
            </select>

            <select id="library-sort" class="form-control">
                <option value="latest">最新上传</option>
                <option value="popular">最多下载</option>
                <option value="name">名称 A-Z</option>
                <option value="size">文件大小</option>
            </select>

            <button class="btn btn-primary" id="upload-btn">
                <i class="fas fa-upload"></i> 上传资料
            </button>
        </div>
    </div>

    <!-- 资料卡片网格 -->
    <div class="module-grid library-grid" id="library-grid">
        <!-- 资料卡片将通过JavaScript动态生成 -->
    </div>

    <!-- 分页与统计 -->
    <div class="library-footer">
        <div class="library-stats">
            <span>共 24 个资源</span>
            <span>分类：PDF(8) / DOCX(5) / XLSX(3) / PPT(2) / 视频(4) / 其他(2)</span>
        </div>
        <div class="pagination">
            <button class="btn btn-outline btn-sm" disabled>
                <i class="fas fa-chevron-left"></i> 上一页
            </button>
            <span class="page-item active">1</span>
            <span class="page-item">2</span>
            <span class="page-item">3</span>
            <span class="page-item">...</span>
            <span class="page-item">5</span>
            <button class="btn btn-outline btn-sm">
                下一页 <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
</div>

<!-- 上传资料弹窗 -->
<div class="modal" id="upload-modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-upload"></i> 上传资料</h3>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <form id="upload-form">
                <div class="form-group">
                    <label for="material-name">资料名称 <span class="required">*</span></label>
                    <input type="text" id="material-name" class="form-control" placeholder="请输入资料名称" required>
                </div>
                
                <div class="form-group">
                    <label for="material-category">分类</label>
                    <select id="material-category" class="form-control">
                        <option value="general">通用</option>
                        <option value="technical">技术文档</option>
                        <option value="design">设计资料</option>
                        <option value="training">培训资料</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="material-type">类型</label>
                    <select id="material-type" class="form-control">
                        <option value="pdf">PDF</option>
                        <option value="doc">Word</option>
                        <option value="xls">Excel</option>
                        <option value="ppt">PPT</option>
                        <option value="video">视频</option>
                        <option value="image">图片</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="material-description">描述</label>
                    <textarea id="material-description" class="form-control" rows="3" placeholder="请输入资料描述"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="material-tags">标签</label>
                    <input type="text" id="material-tags" class="form-control" placeholder="请输入标签，用逗号分隔">
                </div>
                
                <div class="form-group">
                    <label for="material-version">版本</label>
                    <input type="text" id="material-version" class="form-control" placeholder="请输入版本号">
                </div>
                
                <div class="form-group">
                    <label for="material-language">语言</label>
                    <select id="material-language" class="form-control">
                        <option value="zh">中文</option>
                        <option value="en">英文</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>文件 <span class="required">*</span></label>
                    <div class="upload-area" id="upload-dropzone">
                        <i class="fas fa-cloud-upload-alt fa-3x"></i>
                        <p>拖拽文件到此处或 <button type="button" class="btn-link">选择文件</button></p>
                        <div id="file-info" style="margin-top: 10px; font-size: 14px; color: #666;"></div>
                    </div>
                    <input type="file" id="file-input" style="display: none;">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline modal-close">取消</button>
            <button type="button" class="btn btn-primary" id="submit-upload">上传</button>
        </div>
    </div>
</div>

<!-- 统一脚本 -->
<script type="module" src="library.js"></script>
</body>
</html>
