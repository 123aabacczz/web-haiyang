<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>设置 - 知识协作平台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./settings.css" />
    <style>
        .settings-container{display:grid;gap:2rem}
        .settings-section{border:1px solid var(--border-color);border-radius:var(--radius);padding:1.5rem;background:var(--card-bg)}
        .settings-section h3{margin-bottom:1rem;font-size:1.1rem}
        .settings-item{display:flex;justify-content:space-between;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--border-color)}
        .settings-item:last-child{border-bottom:none}
        .toggle-switch{position:relative;display:inline-block;width:42px;height:24px}
        .toggle-switch input{opacity:0;width:0;height:0}
        .toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border-color);transition:.3s;border-radius:24px}
        .toggle-slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%}
        input:checked+.toggle-slider{background:var(--primary-color)}
        input:checked+.toggle-slider:before{transform:translateX(18px)}
    </style>
</head>
<body>

<main class="main-content">
    <div class="container">
        <h1 class="module-title"><i class="fas fa-cog"></i> 设置</h1>
        <p class="module-subtitle">管理账户和偏好设置</p>

        <div class="settings-container">
            <div class="settings-section">
                <h3><i class="fas fa-user"></i> 账户设置</h3>
                <div class="settings-item">
                    <div><h4>个人信息</h4><p>更新姓名、职位和联系方式</p></div>
                    <button class="btn btn-outline btn-sm modal-open-btn" data-target="profile-modal">编辑</button>
                </div>
                <div class="settings-item">
                    <div><h4>登录密码</h4><p>修改账户登录密码</p></div>
                    <button class="btn btn-outline btn-sm modal-open-btn" data-target="password-modal">修改</button>
                </div>
                <div class="settings-item">
                    <div><h4>双重认证</h4><p>为账户增加安全保护层</p></div>
                    <label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label>
                </div>
            </div>

            <div class="settings-section">
                <h3><i class="fas fa-bell"></i> 通知设置</h3>
                <form id="notifications-form">
                    <div class="settings-item">
                        <div><h4>邮件通知</h4><p>接收重要邮件提醒</p></div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="email-notifications" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="settings-item">
                        <div><h4>桌面通知</h4><p>浏览器桌面弹窗提醒</p></div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="desktop-notifications" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <button type="submit" style="display: none;">保存</button>
                </form>
            </div>

            <div class="settings-section">
                <h3><i class="fas fa-shield-alt"></i> 安全与隐私</h3>
                <div class="settings-item">
                    <div><h4>登录设备管理</h4><p>查看并管理登录设备</p></div>
                    <button class="btn btn-outline btn-sm modal-open-btn" data-target="devices-modal">管理</button>
                </div>
                <div class="settings-item">
                    <div><h4>登录历史</h4><p>查看账户登录记录</p></div>
                    <button class="btn btn-outline btn-sm modal-open-btn" data-target="login-history-modal">查看</button>
                </div>
                <div class="settings-item">
                    <div><h4>导出个人数据</h4><p>备份您的全部数据</p></div>
                    <button class="btn btn-outline btn-sm modal-open-btn" data-target="export-data-modal">导出</button>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- 模态框结构 -->
<div id="profile-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3>编辑个人信息</h3>
        <form id="profile-form">
            <div class="form-group">
                <label for="name">姓名</label>
                <input type="text" id="name" placeholder="请输入姓名">
            </div>
            <div class="form-group">
                <label for="position">职位</label>
                <input type="text" id="position" placeholder="请输入职位">
            </div>
            <div class="form-group">
                <label for="contact">联系方式</label>
                <input type="text" id="contact" placeholder="请输入联系方式">
            </div>
            <button type="submit" class="btn btn-primary">保存更改</button>
        </form>
    </div>
</div>

<div id="password-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3>修改登录密码</h3>
        <form id="password-form">
            <div class="form-group">
                <label for="current-password">当前密码</label>
                <input type="password" id="current-password" placeholder="请输入当前密码" required>
            </div>
            <div class="form-group">
                <label for="new-password">新密码</label>
                <input type="password" id="new-password" placeholder="≥8位 含大小写及数字" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">确认新密码</label>
                <input type="password" id="confirm-password" placeholder="再次输入新密码" required>
            </div>

            <button type="submit" class="btn btn-primary">确认修改</button>
            <button type="button" id="forgot-password-btn" class="btn btn-link">忘记密码？</button>
        </form>
    </div>
</div>

<!-- 其他模态框结构类似，这里省略部分以节省空间 -->
<div id="devices-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3>登录设备管理</h3>
        <div id="devices-list" class="device-list">
            <!-- 设备将由JavaScript动态加载 -->
        </div>
    </div>
</div>

<!-- 登录历史模态框 -->
<div id="login-history-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3>登录历史</h3>
        <div id="login-history-list" class="device-list">
            <!-- 登录历史将由JavaScript动态加载 -->
        </div>
        <div style="margin-top: 1rem; text-align: center;">
            <button class="btn btn-outline" id="load-more-history">加载更多记录</button>
        </div>
    </div>
</div>

<!-- 导出个人数据模态框 -->
<div id="export-data-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3>导出个人数据</h3>
        <form id="export-form">
            <div class="form-group">
                <label for="export-format">导出格式</label>
                <select id="export-format" class="form-control">
                    <option value="json">JSON</option>
                    <option value="csv">CSV</option>
                    <option value="xml">XML</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date-range">时间范围</label>
                <select id="date-range" class="form-control">
                    <option value="all">所有时间</option>
                    <option value="30">最近30天</option>
                    <option value="7">最近7天</option>
                    <option value="custom">自定义范围</option>
                </select>
            </div>
            <div class="form-group" id="custom-date-range" style="display: none;">
                <label for="start-date">开始日期</label>
                <input type="date" id="start-date" class="form-control">
                <label for="end-date" style="margin-top: 0.5rem;">结束日期</label>
                <input type="date" id="end-date" class="form-control">
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="include-files" checked>
                    包含上传的文件
                </label>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="include-activity" checked>
                    包含活动记录
                </label>
            </div>
            <button type="submit" class="btn btn-primary">生成导出文件</button>
        </form>
    </div>
</div>

<script type="module" src="settings.js"></script>
</body>
</html>
