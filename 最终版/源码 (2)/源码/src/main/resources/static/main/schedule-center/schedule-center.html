<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>日程中心 - 知识协作平台</title>

    <!-- 样式与图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../main.css?v=20261028"/>
    <link rel="stylesheet" href="schedule-center.css?v=20261028"/>
    <script src="../theme.js?v=20261028"></script>

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.6/dayjs.min.js"></script>
</head>

<body>
<!-- 导航栏 -->
<header>
  <div class="container">
    <div class="navbar">
      <div class="logo">
        <i class="fas fa-brain"></i>
        <span>知识协作平台</span>
      </div>

      <nav class="nav-links">
        <a href="../main.html" class="nav-link active" aria-current="page">
          <i class="fas fa-home"></i> 返回主页
        </a>

        <!-- 协作中心下拉 -->
        <div class="nav-dropdown">
          <button class="nav-dropdown-btn">
            协作中心 <i class="fas fa-chevron-down"></i>
          </button>
          <div class="nav-dropdown-content">
            <a href="../task-center/task-center.html" class="nav-link">任务中心</a>
            <a href="../schedule-center/schedule-center.html" class="nav-link">日程中心</a>
            <a href="../team-management/team-management.html" class="nav-link">成员中心</a>
          </div>
        </div>

        <!-- 知识库下拉 -->
        <div class="nav-dropdown">
          <button class="nav-dropdown-btn">
            知识库 <i class="fas fa-chevron-down"></i>
          </button>
          <div class="nav-dropdown-content">
            <a href="../library/library.html" class="nav-link">资料库</a>
            <a href="../learning-area/learning-area.html" class="nav-link">学习区</a>
          </div>
        </div>

        <a href="../personal-center/personal-center.html" class="nav-link">个人中心</a>
      </nav>

      <!-- 右侧功能：搜索、主题、通知、用户信息 -->
      <div class="header-actions">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="搜索内容、文档或成员..." id="global-search" aria-label="全局搜索">
        </div>

        <div class="theme-toggle">
          <input type="checkbox" id="theme-switch" hidden aria-label="切换主题">
          <label for="theme-switch" class="toggle-label">
            <i class="fas fa-sun"></i>
            <i class="fas fa-moon"></i>
            <span class="toggle-ball"></span>
          </label>
        </div>

        <div class="notifications" id="notifications-btn" aria-label="通知">
          <i class="fas fa-bell"></i>
          <span class="notification-badge">3</span>
        </div>

        <!-- 用户信息部分 -->
        <div class="user-info" id="user-info-btn">
          <div class="user-avatar"><i class="fas fa-user"></i></div>
          <div class="user-details">
            <div class="user-name" id="header-user-name">加载中...</div>
            <div class="user-rank" id="header-user-rank">加载中...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
<div id="schedule-center" class="module-content active">
    <div class="module-header">
        <div class="module-header-content">
            <h2 class="module-title">
                <i class="fas fa-calendar-days"></i> 我的日程
            </h2>
            <p class="module-subtitle">管理您的会议、任务和活动安排</p>
        </div>
        <div class="current-date-display">
            <span id="current-full-date">2025年9月1日 周一</span>
        </div>
    </div>

    <!-- 顶部控制区 -->
    <div class="schedule-controls">
        <div class="view-type-selector">
            <button class="view-type-btn active" data-view="month">
                <i class="fas fa-calendar"></i> 月视图
            </button>
            <button class="view-type-btn" data-view="week">
                <i class="fas fa-calendar-week"></i> 周视图
            </button>
            <button class="view-type-btn" data-view="day">
                <i class="fas fa-calendar-day"></i> 日视图
            </button>
            <button class="view-type-btn" data-view="list">
                <i class="fas fa-list"></i> 列表视图
            </button>
        </div>

        <div class="schedule-actions">
            <div class="dropdown">
                <button class="btn btn-outline filter-btn">
                    <i class="fas fa-filter"></i> 筛选
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-menu">
                    <div class="filter-options">
                        <label class="checkbox-label">
                            <input type="checkbox" checked data-type="meeting"> 会议
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" checked data-type="task"> 任务
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" checked data-type="project"> 项目
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" checked data-type="personal"> 个人
                        </label>
                    </div>
                </div>
            </div>

            <button class="btn btn-primary" id="create-event-btn">
                <i class="fas fa-plus"></i> 新建日程
            </button>
        </div>
    </div>

    <!-- 日期导航 -->
    <div class="date-navigation">
        <button class="btn btn-outline nav-btn" id="prev-period">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div class="current-period-display">
            <span id="current-period">2025年9月</span>
            <span class="today-indicator">今天: 9月1日 周一</span>
        </div>
        <button class="btn btn-outline nav-btn" id="next-period">
            <i class="fas fa-chevron-right"></i>
        </button>
        <button class="btn btn-outline" id="today-btn">返回今天</button>
    </div>

    <!-- 主内容区 -->
    <div class="schedule-content">
        <!-- 日历视图 -->
        <div id="calendar-container" class="calendar-view active">
            <div id="calendar"></div>
        </div>

        <!-- 列表视图 -->
        <div id="list-container" class="list-view" style="display:none;">
            <div class="list-header">
                <h3>日程列表</h3>
                <select id="list-range" class="form-control">
                    <option value="today">今天</option>
                    <option value="week">本周</option>
                    <option value="month">本月</option>
                </select>
            </div>
            <div class="event-list" id="event-list">
                <!-- 动态加载 -->
            </div>
        </div>

        <!-- 近期日程 -->
        <div class="upcoming-events">
            <h3><i class="fas fa-clock"></i> 近期日程</h3>
            <div class="upcoming-list" id="upcoming-list">
                <div class="event-card">
                    <div class="event-time">09:00 - 10:00</div>
                    <div class="event-title">需求评审会议</div>
                    <div class="event-meta">
                        <span class="event-type meeting">会议</span>
                        <span class="event-location">A3 会议室</span>
                    </div>
                </div>
                <div class="event-card">
                    <div class="event-time">14:00 - 15:30</div>
                    <div class="event-title">React 性能优化分享</div>
                    <div class="event-meta">
                        <span class="event-type personal">个人</span>
                        <span class="event-location">线上 Zoom</span>
                    </div>
                </div>
                <div class="event-card">
                    <div class="event-time">全天</div>
                    <div class="event-title">迭代版本发布</div>
                    <div class="event-meta">
                        <span class="event-type project">项目</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 新建日程模态框 -->
<div id="event-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-calendar-plus"></i> 新建日程</h3>
            <span class="close-modal">&times;</span>
        </div>
        <div class="modal-body">
            <form id="event-form">
                <div class="form-group">
                    <label for="event-title">标题 *</label>
                    <input type="text" id="event-title" placeholder="输入日程标题" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="event-start-date">开始日期 *</label>
                        <input type="date" id="event-start-date" required>
                    </div>
                    <div class="form-group">
                        <label for="event-start-time">开始时间</label>
                        <input type="time" id="event-start-time">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="event-end-date">结束日期 *</label>
                        <input type="date" id="event-end-date" required>
                    </div>
                    <div class="form-group">
                        <label for="event-end-time">结束时间</label>
                        <input type="time" id="event-end-time">
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="event-all-day"> 全天事件
                    </label>
                </div>

                <div class="form-group">
                    <label for="event-type">类型 *</label>
                    <select id="event-type" required>
                        <option value="meeting">会议</option>
                        <option value="task">任务</option>
                        <option value="project">项目</option>
                        <option value="personal">个人</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="event-location">地点</label>
                    <input type="text" id="event-location" placeholder="输入会议地点或链接">
                </div>

                <div class="form-group">
                    <label for="event-description">描述</label>
                    <textarea id="event-description" rows="3" placeholder="添加日程详情..."></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline" id="cancel-event">取消</button>
            <button type="button" class="btn btn-primary" id="save-event">保存</button>
        </div>
    </div>
</div>

<!-- 统一脚本 -->
<script type="module" src="schedule-center.js"></script>
</body>
</html>
