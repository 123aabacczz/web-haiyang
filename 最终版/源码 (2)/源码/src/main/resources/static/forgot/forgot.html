<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="forgot.css"/>
</head>
<body>
<div id="background-container">
    <canvas id="galaxy-canvas"></canvas>
    <canvas id="ocean-canvas"></canvas>
</div>

<div class="control-panel">
    <h3><i class="fas fa-sliders-h"></i> 背景效果控制</h3>
    <div class="control-group">
        <label for="particle-density"><i class="fas fa-dot-circle"></i> 粒子密度</label>
        <div class="slider-container">
            <input type="range" id="particle-density" min="150" max="500" value="300">
            <span id="particle-density-value">300</span>
        </div>
    </div>
    <div class="control-group">
        <label for="bubble-frequency"><i class="fas fa-water"></i> 气泡频率</label>
        <div class="slider-container">
            <input type="range" id="bubble-frequency" min="3" max="15" value="8">
            <span id="bubble-frequency-value">8</span>
        </div>
    </div>
    <div class="control-group">
        <label for="beam-count"><i class="fas fa-sun"></i> 光束数量</label>
        <div class="slider-container">
            <input type="range" id="beam-count" min="8" max="25" value="15">
            <span id="beam-count-value">15</span>
        </div>
    </div>
    <div class="control-group">
        <label for="seabed-ripple-frequency"><i class="fas fa-wave-square"></i> 海底涟漪频率</label>
        <div class="slider-container">
            <input type="range" id="seabed-ripple-frequency" min="0.05" max="0.25" step="0.01" value="0.12">
            <span id="seabed-ripple-frequency-value">0.12</span>
        </div>
    </div>
    <button id="theme-toggle"><i class="fas fa-moon"></i> 切换主题</button>
</div>

<div class="box">
    <h2>找回密码</h2>
    <form id="forgotForm">
        <div class="form-group">
            <label for="email">注册邮箱</label>
            <div class="input-with-icon">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" name="email" required placeholder="请输入您的邮箱">
            </div>
            <span id="emailErr" class="error"></span>
        </div>

        <div class="form-group">
            <label for="secret">注册暗号</label>
            <div class="input-with-icon">
                <i class="fas fa-key"></i>
                <input type="text" id="secret" name="secret" required placeholder="请输入您的注册暗号">
            </div>
        </div>

        <div class="form-group">
            <label for="newPassword">新密码</label>
            <div class="input-with-icon">
                <i class="fas fa-lock"></i>
                <input type="password" id="newPassword" name="newPassword" required placeholder="请输入新密码">
                <i class="fas fa-eye password-toggle" id="passwordToggle"></i>
            </div>
        </div>

        <button type="submit">
            <i class="fas fa-redo-alt"></i> 立即重置
        </button>

        <div class="link-btns">
            <a href="../login/login.html"><i class="fas fa-sign-in-alt"></i> 去登录</a>
            <a href="../register/register.html"><i class="fas fa-user-plus"></i> 去注册</a>
        </div>

        <p id="successMsg" class="success hidden">
            <i class="fas fa-check-circle"></i> 邮件已发送，请查收！
        </p>

        <!-- 用户操作引导 -->
        <div style="font-size:11px;color:#d5b8ff;margin-top:8px;line-height:1.4">
            <i class="fas fa-info-circle"></i> 提示：请输入注册时使用的邮箱与暗号，并设置 ≥6 位新密码。<br>
            <span id="forgotHint" style="display:none;color:#ff8b8b">信息不匹配或格式错误，请核对。</span>
        </div>
    </form>
</div>

<script src="../background/background.js"></script>
<script type="module" src="forgot.js"></script>
<script type="module" src="../api-config.js"></script>
</body>
</html>
