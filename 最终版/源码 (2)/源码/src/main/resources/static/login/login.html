<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空海洋登录系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../background/background.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
<div id="background-container">
    <canvas id="galaxy-canvas"></canvas>
    <canvas id="ocean-canvas"></canvas>
    <div class="horizon-glow"></div>
</div>
<div class="control-panel">
    <h3><i class="fas fa-sliders-h"></i> 特效控制面板</h3>
    <div class="control-group">
        <label for="particle-density"><i class="fas fa-star"></i> 粒子密度</label>
        <div class="slider-container">
            <input type="range" id="particle-density" min="150" max="500" value="300">
            <span id="particle-density-value">300</span>
        </div>
    </div>
    <div class="control-group">
        <label for="bubble-frequency"><i class="fas fa-water"></i> 气泡频率</label>
        <div class="slider-container">
            <input type="range" id="bubble-frequency" min="3" max="15" value="8">
            <span id="bubble-frequency-value">8</span>
        </div>
    </div>
    <div class="control-group">
        <label for="beam-count"><i class="fas fa-bolt"></i> 光束数量</label>
        <div class="slider-container">
            <input type="range" id="beam-count" min="8" max="25" value="15">
            <span id="beam-count-value">15</span>
        </div>
    </div>
    <div class="control-group">
        <label for="seabed-ripple-frequency"><i class="fas fa-wave-square"></i> 海底涟漪</label>
        <div class="slider-container">
            <input type="range" id="seabed-ripple-frequency" min="0.05" max="0.25" step="0.01" value="0.12">
            <span id="seabed-ripple-frequency-value">0.12</span>
        </div>
    </div>
    <button id="theme-toggle"><i class="fas fa-palette"></i> 切换主题</button>
    <button id="reset-btn"><i class="fas fa-sync-alt"></i> 重置设置</button>
</div>

<div class="login-container">
    <div class="login-header">
        <h1><i class="fas fa-user-astronaut"></i> 用户登录</h1>
        <p>探索未知的旅程</p>
    </div>
    <form id="loginForm">
        <div class="input-group">
            <div class="input-icon"><i class="fas fa-user"></i></div>
            <input type="text" id="username" name="username" required placeholder="请输入用户名">
        </div>
        <div class="input-group">
            <div class="input-icon"><i class="fas fa-lock"></i></div>
            <input type="password" id="password" name="password" required placeholder="请输入密码">
            <span class="password-toggle"><i class="fas fa-eye"></i></span>
        </div>
        <div class="input-group">
            <div class="input-icon"><i class="fas fa-envelope"></i></div>
            <input type="email" id="email" name="email" required placeholder="请输入邮箱">
        </div>
        <div class="remember-forgot">
            <label>
                <input type="checkbox" id="remember">
                <span>记住我</span>
            </label>
            <a href="../forgot/forgot.html">忘记密码?</a>
        </div>
        <button type="submit" class="login-btn">
            <i class="fas fa-sign-in-alt"></i> 登录
            <span class="btn-glow"></span>
        </button>
        <!-- 在登录按钮后添加管理员登录按钮 -->
        <button type="button" class="admin-login-btn">
            <i class="fas fa-user-cog"></i> 管理员登录
            <span class="btn-glow"></span>
        </button>

        <!-- 用户操作引导 -->
        <div style="font-size:11px;color:#d5b8ff;margin-top:8px;line-height:1.4">
            <i class="fas fa-info-circle"></i> 提示：点击密码框右侧 👁️ 图标可显示/隐藏密码。<br>
            <span id="loginHint" style="display:none;color:#ff8b8b">用户名、密码或邮箱不能为空！</span>
        </div>
    </form>
    <div class="register-link">
        没有账号? <a href="../register/register.html">立即注册</a>
    </div>
</div>

<script src="../background/background.js"></script>
<script type="module" src="login.js"></script>
<script type="module" src="../api-config.js"></script>
</body>
</html>
